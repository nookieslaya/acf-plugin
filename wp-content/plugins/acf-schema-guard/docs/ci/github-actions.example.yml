name: ACF Schema Guard

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ACF Schema Guard baseline check
        run: |
          # Bootstrap WordPress, its database, ACF, and this plugin before this step.
          wp acf-schema-guard baseline check acf-schema-baseline.json --fail-on-breaking
